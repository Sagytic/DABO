# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# JWT
jwt.secret=test_secret_key_for_testing_only_1234567890
jwt.expiration=3600000

# Ethereum (Dummy values)
eth.encrypted.password=test_password
eth.erc20.contract=0x0000000000000000000000000000000000000000
eth.purchase.record.contract=0x0000000000000000000000000000000000000000
eth.admin.address=0x0000000000000000000000000000000000000000
eth.admin.wallet.filename=test.wallet

# Web3j (Disable or mock if possible, but here just dummy)
spring.web3j.client-address=http://localhost:8545
spring.web3j.admin-client=false

# Mail (Dummy)
AdminMail.id=test@example.com
AdminMail.password=testpassword
AdminMail.name="Test Mail Service"

# Logging
logging.level.root=INFO
